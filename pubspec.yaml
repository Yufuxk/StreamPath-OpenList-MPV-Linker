name: streampath
description: "StreamPath — 现代化 Windows WebDAV 文件浏览器：高性能目录浏览、字幕自动匹配、外部播放器联动（mpv 等）与播放进度续播。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── 网络层：WebDAV 请求 ─────────────────────────────────────
  dio: ^5.7.0

  # ── 数据层：本地元数据缓存（目录"秒开"） ────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── 数据层：播放进度 SQLite（桌面需 ffi；动态库由 sqlite3 包的
  #    native assets hook 构建/下载，无需 sqlite3_flutter_libs） ──
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4

  # ── XML：PROPFIND multistatus 响应解析 ─────────────────────
  xml: ^6.5.0

  # ── 依赖 ───────────────────────────────────────────────────
  crypto: ^3.0.6
  meta: ^1.15.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  path: ^1.9.0

  # ── Windows 窗口外观：可选 Acrylic 磨砂背景 ────────────────
  flutter_acrylic: ^1.1.4

  # ── 剪贴板：super_clipboard 深层原生支持（Win+V 剪贴板历史
  #    兼容方案：读取文本更稳健，绕过 Flutter 引擎剪贴板事件限制）──
  super_clipboard: ^0.9.1
  win32: ^5.15.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 测试中加载本地 sqlite3.dll（进度库测试）
  sqlite3: ^3.5.0

  # 剪贴板历史修复的 Timer 冲刷测试（fakeAsync）
  fake_async: ^1.3.3

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
